<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lua Obfuscator & VM</title>
<!--
  Lua Obfuscator & VM Protector
  Author: Rainy_qwq
  URL:    https://github.com/Rainyqwq/Lua-Obfuscator
  License: MIT
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--fg:#c9d1d9;--fg2:#8b949e;--accent:#58a6ff;--accent2:#3fb950;--err:#f85149;--warn:#d29922;--border:#30363d;--code-bg:#0d1117}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:16px;flex-shrink:0}
header h1{font-size:16px;font-weight:600;color:var(--accent)}
header .tag{font-size:11px;background:var(--accent);color:var(--bg);padding:2px 6px;border-radius:3px;font-weight:600}
.main{display:flex;flex:1;overflow:hidden}
.panel{display:flex;flex-direction:column;border-right:1px solid var(--border);flex:1;min-width:0;position:relative}
.panel:last-child{border-right:none}
.panel-header{background:var(--bg2);padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;color:var(--fg2);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-header .badge{font-size:10px;padding:2px 6px;border-radius:3px;background:var(--bg3);color:var(--fg2)}
.editor{flex:1;overflow:hidden;position:relative}
textarea{width:100%;height:100%;background:var(--code-bg);color:var(--fg);border:none;padding:12px;font-family:'JetBrains Mono','Fira Code','Cascadia Code',monospace;font-size:13px;line-height:1.6;resize:none;outline:none;tab-size:2}
textarea::selection{background:rgba(88,166,255,0.3)}
.controls{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 12px;flex-shrink:0;overflow-x:auto}
.controls-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.controls-row:last-child{margin-bottom:0}
.controls-row label{font-size:11px;color:var(--fg2);display:flex;align-items:center;gap:4px;cursor:pointer;padding:4px 8px;border-radius:4px;background:var(--bg3);border:1px solid var(--border);white-space:nowrap;transition:all .15s;user-select:none}
.controls-row label:hover{border-color:var(--accent)}
.controls-row label.on{background:rgba(88,166,255,0.15);border-color:var(--accent);color:var(--accent)}
.controls-row label input{display:none}
.btn-row{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
button{padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg3);color:var(--fg);font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button.primary:hover{opacity:0.85}
button.danger{border-color:var(--err);color:var(--err)}
button.danger:hover{background:var(--err);color:#fff}
.output-area{flex:1;overflow:auto;padding:12px;font-family:'JetBrains Mono','Fira Code',monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
.output-area .info{color:var(--accent)}
.output-area .success{color:var(--accent2)}
.output-area .error{color:var(--err)}
.output-area .warn{color:var(--warn)}
.output-area .dim{color:var(--fg2)}
.stats{display:flex;gap:16px;padding:6px 12px;background:var(--bg3);border-top:1px solid var(--border);font-size:11px;color:var(--fg2);flex-shrink:0}
.stats span{white-space:nowrap}
.resizer{width:4px;background:var(--border);cursor:col-resize;flex-shrink:0;transition:background .15s}
.resizer:hover{background:var(--accent)}

/* === Mobile / Tablet responsive === */
@media(max-width:768px){
  body{height:auto;min-height:100vh;overflow:auto;-webkit-overflow-scrolling:touch}
  .main{flex-direction:column;overflow:visible}
  .panel{border-right:none;border-bottom:1px solid var(--border);flex:none}
  .panel#panel-left{flex:none;height:40vh;min-height:200px}
  .panel#panel-right{flex:1;min-height:50vh}
  .resizer{width:100%;height:4px;cursor:row-resize;display:none}
  .editor{flex:1;min-height:0}
  .output-area{min-height:120px}
  header{flex-wrap:wrap;gap:8px;padding:6px 12px}
  header h1{font-size:14px}
  header .tag{font-size:10px}
  header span:last-of-type{display:none}
  .controls{padding:8px}
  .controls-row label{font-size:10px;padding:3px 6px}
  .btn-row{padding:6px 8px}
  button{font-size:10px;padding:4px 8px}
  .stats{flex-wrap:wrap;gap:8px;padding:4px 8px}
  .footer{padding:6px 10px;font-size:10px}
}
@media(max-width:480px){
  .panel#panel-left{height:35vh;min-height:160px}
  header h1{font-size:13px}
  .controls-row{gap:4px}
  .controls-row label{font-size:9px;padding:2px 5px}
  .btn-row{gap:4px;padding:4px 6px}
  button{font-size:9px;padding:3px 6px}
  textarea{font-size:12px;padding:8px}
  .output-area{font-size:12px;padding:8px}
}

/* Batch mode */
.drop-zone{margin:12px;padding:32px;border:2px dashed var(--border);border-radius:8px;text-align:center;color:var(--fg2);cursor:pointer;transition:all .2s;flex-shrink:0}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);color:var(--accent);background:rgba(88,166,255,.05)}
.drop-zone input{display:none}
.file-list{flex:1;overflow:auto;padding:8px}
.file-item{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:4px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;font-size:12px}
.file-item .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.file-item .fsize{color:var(--fg2);font-size:11px;min-width:60px;text-align:right}
.file-item .fstatus{font-size:11px;padding:2px 8px;border-radius:3px;min-width:60px;text-align:center}
.file-item .fstatus.pending{background:var(--bg3);color:var(--fg2)}
.file-item .fstatus.done{background:rgba(63,185,80,.15);color:var(--accent2)}
.file-item .fstatus.error{background:rgba(248,81,73,.15);color:var(--err)}
.file-item .fstatus.processing{background:rgba(88,166,255,.15);color:var(--accent)}
.file-item .fbtn{background:none;border:none;color:var(--fg2);cursor:pointer;padding:2px 6px;font-size:14px}
.file-item .fbtn:hover{color:var(--err)}
.batch-actions{display:flex;gap:6px;padding:8px 12px;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.batch-stats{padding:6px 12px;background:var(--bg3);border-top:1px solid var(--border);font-size:11px;color:var(--fg2);flex-shrink:0}
.footer{background:var(--bg2);border-top:1px solid var(--border);padding:6px 16px;font-size:11px;color:var(--fg2);text-align:center;flex-shrink:0;width:100%}
</style>
</head>
<body>
<header>
  <h1>Lua Obfuscator & VM</h1>
  <span class="tag">v2.10.0</span>
  <span style="flex:1"></span>
  <span style="font-size:12px;color:var(--fg2)">集成 Fengari Lua VM · 10 种混淆技术</span>
</header>
<div class="main">
  <!-- 左：代码编辑器 -->
  <div class="panel" id="panel-left">
    <div class="panel-header">
      <span>源代码</span>
      <span class="badge" id="line-count">0 行</span>
    </div>
    <div class="editor">
      <textarea id="code-input" spellcheck="false" placeholder="在此输入 Lua 代码...">-- 示例：斐波那契数列
local function fibonacci(n)
  if n <= 1 then
    return n
  end
  local a, b = 0, 1
  for i = 2, n do
    local temp = a + b
    a = b
    b = temp
  end
  return b
end

for i = 0, 9 do
  print("fib(" .. i .. ") = " .. fibonacci(i))
end

local max_retries = 5
local timeout_ms = 3000
local pi_approx = 3.14159
local secret_key = 0xDEADBEEF

print("Max retries: " .. max_retries)
print("Timeout: " .. timeout_ms .. "ms")
print("Pi: " .. pi_approx)
print("Key: " .. string.format("0x%X", secret_key))</textarea>
    </div>
    <div class="stats">
      <span id="stat-left-lines">行: 0</span>
      <span id="stat-left-chars">字符: 0</span>
    </div>
  </div>

  <div class="resizer" id="resizer"></div>

  <!-- 右：控制 + 输出 -->
  <div class="panel" id="panel-right">
    <div class="panel-header">
      <span>混淆选项</span>
      <button onclick="toggleAll()" style="font-size:11px;padding:3px 8px">全选/全不选</button>
    </div>
        <div class="controls">
      <div class="controls-row" id="preset-row" style="margin-bottom:8px;align-items:center">
        <span style="font-size:11px;color:var(--fg2);margin-right:6px">预设</span>
        <label data-preset="fast"><input type="radio" name="preset" value="fast"> 快速</label>
        <label class="on" data-preset="balanced"><input type="radio" name="preset" value="balanced" checked> 均衡</label>
        <label data-preset="max"><input type="radio" name="preset" value="max"> 最强</label>
        <label data-preset="custom"><input type="radio" name="preset" value="custom"> 自定义</label>
      </div>
      <div class="controls-row" id="feature-toggles"></div>
      <div class="controls-row" id="whitelist-row" style="margin-top:8px;flex-direction:column;align-items:stretch;gap:6px">
        <label style="display:block;background:transparent;border:none;padding:0;color:var(--fg2)">名称白名单（逗号分隔，不混淆这些标识符）
          <input id="name-whitelist" type="text" placeholder="keep_me, public_api" style="width:100%;margin-top:4px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--fg);font-size:12px">
        </label>
        <label style="display:block;background:transparent;border:none;padding:0;color:var(--fg2)">字符串白名单（逗号分隔，精确匹配）
          <input id="string-whitelist" type="text" placeholder="KEEP_PLAIN, ok" style="width:100%;margin-top:4px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--fg);font-size:12px">
        </label>
      </div>
    </div>
    <div class="btn-row">
      <button class="primary" onclick="doObfuscate()">混淆</button>
      <button onclick="doRunOriginal()">运行原代码</button>
      <button onclick="doRunObfuscated()">运行混淆后</button>
      <button onclick="doCompare()">对比运行</button>
      <button onclick="document.getElementById('file-import').click()">导入文件</button>
      <input type="file" id="file-import" accept=".lua,.txt" multiple style="display:none" onchange="handleImport(event)">
      <button onclick="exportResult()">导出结果</button>
      <button onclick="exportConfig()">导出配置</button>
      <button onclick="document.getElementById('config-import').click()">导入配置</button>
      <input type="file" id="config-import" accept=".json,application/json" style="display:none" onchange="importConfig(event)">
      <button class="danger" onclick="clearOutput()">清空</button>
      <button onclick="loadExample('basic')">基础示例</button>
      <button onclick="loadExample('algo')">算法示例</button>
    </div>
    <div class="panel-header">
      <span>输出</span>
      <span class="badge" id="output-status">就绪</span>
    </div>
    <div class="output-area" id="output">
      <span class="dim">点击 "运行原代码" 或 "混淆" 开始...</span>
    </div>
    <div class="stats">
      <span id="stat-obf-size">混淆后: -</span>
      <span id="stat-ratio">膨胀比: -</span>
      <span id="stat-time">耗时: -</span>
    </div>
    <div id="loading-overlay" style="display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px">
      <div class="spinner" style="width:36px;height:36px;border:3px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin 0.8s linear infinite"></div>
      <span id="loading-text" style="color:#c9d1d9;font-size:14px">混淆中...</span>
      <button onclick="cancelObfuscate()" style="font-size:12px;padding:4px 12px;background:#f85149;color:white;border:none;border-radius:4px;cursor:pointer">取消</button>
    </div>
</div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<!-- Footer -->
<div class="footer">Lua Obfuscator v2.10.0 · Author: Rainy_qwq · <a href="https://github.com/Rainyqwq/Lua-Obfuscator" target="_blank" style="color:var(--accent)">GitHub</a> · MIT License</div>

<script>
// ============================================================
// Author: Rainy_qwq
// Lua Obfuscator Engine (Fengari bridge)
// ============================================================
let _luaObfuscatorReady = false;

// Return the inlined fengari source (UMD root patched window->self so it
// works inside the blob Worker). No fetch/XHR -> file://-safe.
function loadFengariSource() {
  if (typeof FENGARI_SOURCE === 'undefined' || !FENGARI_SOURCE) {
    console.error('[Main] FENGARI_SOURCE not found (run node build_html.js to inline it)');
    return null;
  }
  console.log('[Main] fengari source inlined, length:', FENGARI_SOURCE.length);
  return FENGARI_SOURCE;
}


// Strip only a leading Lua shebang (optional UTF-8 BOM / leading whitespace).
// Never search mid-source: bundle embeds modules then obfuscator; a middle #!
// would wipe package.preload and break require in browser.
function stripLeadingLuaShebang(code) {
  if (typeof code !== 'string' || !code) return code;
  // UTF-8 BOM
  if (code.charCodeAt(0) === 0xFEFF) code = code.slice(1);
  // leading blank lines / spaces
  let i = 0;
  while (i < code.length && (code[i] === ' ' || code[i] === '\t' || code[i] === '\r' || code[i] === '\n')) i++;
  if (code.startsWith('#!', i)) {
    const nl = code.indexOf('\n', i);
    code = nl >= 0 ? code.slice(nl + 1) : '';
  }
  return code;
}

function initLuaObfuscator() {
  try {
    const lauxlib = fengari.lauxlib;
    const lualib = fengari.lualib;
    const lua = fengari.lua;

    window._luaState = lauxlib.luaL_newstate();
    lualib.luaL_openlibs(window._luaState);
    const L = window._luaState;

    // Step 1: Load vm_protect module
    let vmCode = VM_PROTECT_LUA;
    vmCode = stripLeadingLuaShebang(vmCode);
    let status = lauxlib.luaL_loadbuffer(L, fengari.to_luastring(vmCode), vmCode.length, fengari.to_luastring('=vm_protect'));
    if (status !== lua.LUA_OK) throw new Error('vm_protect load: ' + lua.lua_tojsstring(L, -1));
    status = lua.lua_pcall(L, 0, 1, 0);
    if (status !== lua.LUA_OK) throw new Error('vm_protect init: ' + lua.lua_tojsstring(L, -1));
    // Store in package.loaded.vm_protect
    lua.lua_getglobal(L, fengari.to_luastring('package'));
    lua.lua_getfield(L, -1, fengari.to_luastring('loaded'));
    lua.lua_pushvalue(L, -3);
    lua.lua_setfield(L, -2, fengari.to_luastring('vm_protect'));
    lua.lua_settop(L, 0);

    // Step 2: Override dofile
    lua.lua_pushcfunction(L, function(L) {
      const fname = lua.lua_tojsstring(L, 1);
      if (fname === 'vm_protect.lua') {
        lua.lua_getglobal(L, fengari.to_luastring('package'));
        lua.lua_getfield(L, -1, fengari.to_luastring('loaded'));
        lua.lua_getfield(L, -1, fengari.to_luastring('vm_protect'));
        return 1;
      }
      return lauxlib.luaL_error(L, fengari.to_luastring('dofile not supported in web mode'));
    });
    lua.lua_setglobal(L, fengari.to_luastring('dofile'));

    // Step 3: Load obfuscator module
    let obfCode = OBFUSCATOR_LUA;
    obfCode = stripLeadingLuaShebang(obfCode);
    status = lauxlib.luaL_loadbuffer(L, fengari.to_luastring(obfCode), obfCode.length, fengari.to_luastring('=obfuscator'));
    if (status !== lua.LUA_OK) throw new Error('obfuscator load: ' + lua.lua_tojsstring(L, -1));
    status = lua.lua_pcall(L, 0, 1, 0);
    if (status !== lua.LUA_OK) throw new Error('obfuscator init: ' + lua.lua_tojsstring(L, -1) + ' | len=' + obfCode.length + ' preload=' + (obfCode.indexOf('package.preload') >= 0));
    lua.lua_setglobal(L, fengari.to_luastring('_obfuscator'));

    // Step 4: Create wrapper function
    const wrapperCode = 'function _obfuscate_lua(code, opts) return _obfuscator.obfuscate_code(code, opts) end';
    status = lauxlib.luaL_loadbuffer(L, fengari.to_luastring(wrapperCode), wrapperCode.length, fengari.to_luastring('=wrapper'));
    if (status !== lua.LUA_OK) throw new Error('wrapper load: ' + lua.lua_tojsstring(L, -1));
    status = lua.lua_pcall(L, 0, 0, 0);
    if (status !== lua.LUA_OK) throw new Error('wrapper init: ' + lua.lua_tojsstring(L, -1));

    _luaObfuscatorReady = true;
    console.log('[LuaInit] OK');
  } catch (e) {
    const msg = '[LuaInit] FAILED: ' + e.message;
    console.error(msg);
    _luaObfuscatorReady = false;
    _luaInitError = msg;
  }
}
let _luaInitError = null;

// ============================================================
// Web Worker for non-blocking obfuscation
// ============================================================
let _obfuscateWorker = null;
let _obfuscateCallbacks = null;
let _obfuscateTimer = null;

function initObfuscateWorker() {
  if (_obfuscateWorker) return;
  const workerCode = `
    let fengari = null;
    let ready = false;
    let initError = null;

    // Load fengari from inlined source (UMD root patched window->self, so it
    // attaches to the Worker global "self").
    function loadFengari(code) {
      try {
        eval(code);
        fengari = self.fengari;
        if (!fengari) throw new Error('fengari not loaded (self.fengari undefined after eval)');
        console.log('[Worker] fengari loaded');
        return true;
      } catch(e) {
        console.error('[Worker] fengari error:', e);
        return false;
      }
    }

    // Strip only a leading Lua shebang.
    // NOTE: inside a template literal, backslash escapes are processed by the
    // template, so the whitespace comparisons below use doubled backslashes
    // (\\t \\r \\n) to yield the JS string escapes for tab/cr/lf.
    function stripLeadingLuaShebang(code) {
      if (typeof code !== 'string' || !code) return code;
      if (code.charCodeAt(0) === 0xFEFF) code = code.slice(1);
      let i = 0;
      while (i < code.length && (code[i] === ' ' || code[i] === '\\t' || code[i] === '\\r' || code[i] === '\\n')) i++;
      if (code.startsWith('#!', i)) {
        const nl = code.indexOf('\\n', i);
        code = nl >= 0 ? code.slice(nl + 1) : '';
      }
      return code;
    }

    function init() {
      console.log('[Worker] Initializing...');
      if (!fengari) {
        self.postMessage({ type: 'error', error: 'fengari未加载' });
        return;
      }
      try {
        const lauxlib = fengari.lauxlib;
        const lualib = fengari.lualib;
        const lua = fengari.lua;

        self._luaState = lauxlib.luaL_newstate();
        lualib.luaL_openlibs(self._luaState);
        const L = self._luaState;
        console.log('[Worker] Lua state created');

        // Load vm_protect
        let vmCode = self._vmCode;
        console.log('[Worker] vm_protect code length:', vmCode ? vmCode.length : 0);
        vmCode = stripLeadingLuaShebang(vmCode);
        let status = lauxlib.luaL_loadbuffer(L, fengari.to_luastring(vmCode), vmCode.length, fengari.to_luastring('=vm_protect'));
        if (status !== lua.LUA_OK) throw new Error('vm_protect load: ' + lua.lua_tojsstring(L, -1));
        status = lua.lua_pcall(L, 0, 1, 0);
        if (status !== lua.LUA_OK) throw new Error('vm_protect init: ' + lua.lua_tojsstring(L, -1));
        lua.lua_getglobal(L, fengari.to_luastring('package'));
        lua.lua_getfield(L, -1, fengari.to_luastring('loaded'));
        lua.lua_pushvalue(L, -3);
        lua.lua_setfield(L, -2, fengari.to_luastring('vm_protect'));
        lua.lua_settop(L, 0);
        console.log('[Worker] vm_protect loaded');

        // Override dofile
        lua.lua_pushcfunction(L, function(L) {
          const fname = lua.lua_tojsstring(L, 1);
          if (fname === 'vm_protect.lua') {
            lua.lua_getglobal(L, fengari.to_luastring('package'));
            lua.lua_getfield(L, -1, fengari.to_luastring('loaded'));
            lua.lua_getfield(L, -1, fengari.to_luastring('vm_protect'));
            return 1;
          }
          return lauxlib.luaL_error(L, fengari.to_luastring('dofile not supported in worker'));
        });
        lua.lua_setglobal(L, fengari.to_luastring('dofile'));

        // Load obfuscator
        let obfCode = self._obfCode;
        console.log('[Worker] obfuscator code length:', obfCode ? obfCode.length : 0);
        obfCode = stripLeadingLuaShebang(obfCode);
        status = lauxlib.luaL_loadbuffer(L, fengari.to_luastring(obfCode), obfCode.length, fengari.to_luastring('=obfuscator'));
        if (status !== lua.LUA_OK) throw new Error('obfuscator load: ' + lua.lua_tojsstring(L, -1));
        status = lua.lua_pcall(L, 0, 1, 0);
        if (status !== lua.LUA_OK) throw new Error('obfuscator init: ' + lua.lua_tojsstring(L, -1));
        lua.lua_setglobal(L, fengari.to_luastring('_obfuscator'));
        console.log('[Worker] obfuscator loaded');

        // Create wrapper
        const wrapperCode = 'function _obfuscate_lua(code, opts) return _obfuscator.obfuscate_code(code, opts) end';
        status = lauxlib.luaL_loadbuffer(L, fengari.to_luastring(wrapperCode), wrapperCode.length, fengari.to_luastring('=wrapper'));
        if (status !== lua.LUA_OK) throw new Error('wrapper load: ' + lua.lua_tojsstring(L, -1));
        status = lua.lua_pcall(L, 0, 0, 0);
        if (status !== lua.LUA_OK) throw new Error('wrapper init: ' + lua.lua_tojsstring(L, -1));
        console.log('[Worker] wrapper created');

        ready = true;
        console.log('[Worker] Ready!');
        self.postMessage({ type: 'ready' });
      } catch(e) {
        console.error('[Worker] Init error:', e);
        initError = e.message;
        self.postMessage({ type: 'error', error: '初始化失败: ' + e.message });
      }
    }
    
    self.onmessage = function(e) {
      const msg = e.data;
      if (msg.type === 'init') {
        // First load fengari, then init
        if (!fengari && msg.fengariCode) {
          loadFengari(msg.fengariCode);
        }
        self._vmCode = msg.vmCode;
        self._obfCode = msg.obfCode;
        init();
      } else if (msg.type === 'obfuscate') {
        if (!ready) {
          self.postMessage({ type: 'error', error: '引擎未就绪: ' + (initError || '初始化中') });
          return;
        }
        try {
          const L = self._luaState;
          const lua = fengari.lua;
          const lauxlib = fengari.lauxlib;

          console.log('[Worker] Starting obfuscation, code length:', msg.code ? msg.code.length : 0);
          lua.lua_getglobal(L, fengari.to_luastring('_obfuscate_lua'));
          lua.lua_pushstring(L, fengari.to_luastring(msg.code));

                lua.lua_pushboolean(L, value);
                lua.lua_setfield(L, -2, fengari.to_luastring(key));
              }
            }
          } else {
            lua.lua_pushnil(L);
          }
          console.log('[Worker] Calling pcall...');
          const status = lua.lua_pcall(L, 2, 1, 0);
          if (status !== lua.LUA_OK) {
            const err = lua.lua_tojsstring(L, -1);
            console.error('[Worker] Obfuscation failed:', err);
            lua.lua_settop(L, 0);
            self.postMessage({ type: 'error', error: '混淆失败: ' + err });
            return;
          }

          console.log('[Worker] Obfuscation done, result length:', result ? result.length : 0);
          lua.lua_settop(L, 0);
          self.postMessage({ type: 'result', code: result });
        } catch(e) {

          self.postMessage({ type: 'error', error: '混淆失败: ' + e.message });
        }
      }
    };
  `;
  
  const blob = new Blob([workerCode], { type: 'application/javascript' });
  _obfuscateWorker = new Worker(URL.createObjectURL(blob));

  // Add error handler for worker errors
  _obfuscateWorker.onerror = function(e) {
    console.error('[Worker Error]', e);
    _luaObfuscatorReady = false;
    if (_obfuscateCallbacks) {
      _obfuscateCallbacks.reject(new Error('Worker错误: ' + (e.message || '未知错误')));
      _obfuscateCallbacks = null;
    }
    hideLoading();
  };

  _obfuscateWorker.onmessage = function(e) {
    const msg = e.data;
    if (msg.type === 'ready') {
      console.log('[Worker] Ready');
      _luaObfuscatorReady = true;
      setStatus('就绪', 'ok');
    } else if (msg.type === 'result') {
      if (_obfuscateCallbacks) {
        _obfuscateCallbacks.resolve(msg.code);
        _obfuscateCallbacks = null;
      }
      hideLoading();
    } else if (msg.type === 'error') {
      console.error('[Worker] Error:', msg.error);
      if (_obfuscateCallbacks) {

        _obfuscateCallbacks = null;

function cancelObfuscate() {
  if (_obfuscateWorker) {
    _obfuscateWorker.terminate();
    _obfuscateWorker = null;
    _luaObfuscatorReady = false;
  }
  if (_obfuscateCallbacks) {
    _obfuscateCallbacks.reject(new Error('用户取消'));
    _obfuscateCallbacks = null;
  }
  hideLoading();
  setStatus('已取消', 'warn');
  appendOutput('混淆已取消\n', 'warn');
  // Re-init worker for next use
  setTimeout(() => initObfuscateWorker(), 100);
}

function obfuscateLuaAsync(sourceCode, options) {
  return new Promise((resolve, reject) => {
    if (!_obfuscateWorker || !_luaObfuscatorReady) {
      reject(new Error('Worker未就绪'));
      return;
    }
    _obfuscateCallbacks = { resolve, reject };
    _obfuscateWorker.postMessage({
      type: 'obfuscate',
      code: sourceCode,
      options: options
    });
    // Timeout: hard cap so complex inputs cannot freeze the tab forever
    const OBFUSCATE_TIMEOUT_MS = 90000;
    _obfuscateTimer = setTimeout(() => {
      if (_obfuscateCallbacks) {
        _obfuscateCallbacks.reject(new Error('混淆超时（' + (OBFUSCATE_TIMEOUT_MS/1000) + '秒）。请减少开启的 Pass 或缩小输入后重试'));
        _obfuscateCallbacks = null;
        cancelObfuscate();
      }
    }, OBFUSCATE_TIMEOUT_MS);
  });
}

// Legacy sync fallback (for runLua etc.)
function obfuscateLua(sourceCode, options) {
  if (!_luaObfuscatorReady) throw new Error('Lua混淆器未就绪（初始化失败，请查看控制台 [LuaInit] 日志）');
  const L = window._luaState;
  const lua = fengari.lua;
  const lauxlib = fengari.lauxlib;

  // 确保栈干净
  lua.lua_settop(L, 0);

  lua.lua_getglobal(L, fengari.to_luastring('_obfuscate_lua'));
  lua.lua_pushstring(L, fengari.to_luastring(sourceCode));
  if (options) {
    lua.lua_newtable(L);
    for (const [key, value] of Object.entries(options)) {
      lua.lua_pushboolean(L, value);
      lua.lua_setfield(L, -2, fengari.to_luastring(key));
    }
  } else {
    lua.lua_pushnil(L);
  }
  const status = lua.lua_pcall(L, 2, 1, 0);
  if (status !== lua.LUA_OK) {
    const err = lua.lua_tojsstring(L, -1);
    lua.lua_settop(L, 0);
    throw new Error('混淆失败: ' + err);
  }
  const result = lua.lua_tojsstring(L, -1);
  lua.lua_settop(L, 0);
  return result;
}
